<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>HireView - Live Job Search</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Outfit',sans-serif;
    background:#0b0f19;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    font-size:52px;
    margin-bottom:10px;
}

.highlight{
    color:#4f8ef7;
}

.subtitle{
    text-align:center;
    color:#a0a0a0;
    margin-bottom:50px;
}

.search-box{
    background:#121826;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
}

input,select{
    background:#1b2335;
    border:none;
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:15px;
    width:100%;
}

button{
    background:#4f8ef7;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
    margin-top:20px;
}

button:hover{
    opacity:0.9;
}

.results{
    margin-top:40px;
}

.job-card{
    background:#121826;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.08);
}

.job-title{
    font-size:24px;
    font-weight:700;
}

.company{
    color:#4f8ef7;
    margin-top:5px;
}

.meta{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.badge{
    background:#1b2335;
    padding:8px 12px;
    border-radius:30px;
    font-size:13px;
}

.description{
    margin-top:20px;
    color:#cfcfcf;
    line-height:1.7;
}

.apply-btn{
    display:inline-block;
    margin-top:20px;
    background:#4f8ef7;
    color:white;
    padding:12px 20px;
    border-radius:12px;
    text-decoration:none;
}

.loading{
    text-align:center;
    margin-top:40px;
    color:#999;
}

</style>
</head>

<body>

<div class="container">

<h1>Hire<span class="highlight">View</span></h1>

<p class="subtitle">
Find real-time jobs from Product Companies & GCCs
</p>

<div class="search-box">

<div class="grid">

<input type="text" id="role" placeholder="Job Role">
<input type="text" id="skills" placeholder="Skills">
<input type="text" id="location" placeholder="Location">

</div>

<button onclick="searchJobs()" id="searchBtn">
Search Jobs
</button>

</div>

<div class="results" id="results"></div>

</div>

<script>

async function searchJobs(){

    const role =
        document.getElementById('role').value;

    const skills =
        document.getElementById('skills').value;

    const location =
        document.getElementById('location').value;

    const results =
        document.getElementById('results');

    const btn =
        document.getElementById('searchBtn');

    if(!role){
        alert('Please enter job role');
        return;
    }

    btn.innerHTML = 'Searching...';

    results.innerHTML = `
        <div class="loading">
            Fetching live jobs...
        </div>
    `;

    try{

        const query =
            `${role} ${skills} ${location}`;

        const response =
            await fetch(`/api/jobs?q=${encodeURIComponent(query)}`);

        const data =
            await response.json();

        console.log(data);

        const jobs =
            data.data || [];

        if(jobs.length === 0){

            results.innerHTML = `
                <div class="loading">
                    No jobs found.
                </div>
            `;

            btn.innerHTML = 'Search Jobs';

            return;
        }

        results.innerHTML = '';

        jobs.forEach(job => {

            results.innerHTML += `

            <div class="job-card">

                <div class="job-title">
                    ${job.job_title || 'Unknown Role'}
                </div>

                <div class="company">
                    ${job.employer_name || 'Unknown Company'}
                </div>

                <div class="meta">

                    <div class="badge">
                        📍 ${job.job_city || 'India'}
                    </div>

                    <div class="badge">
                        💼 ${job.job_employment_type || 'Full Time'}
                    </div>

                </div>

                <div class="description">
                    ${job.job_description
                        ? job.job_description.substring(0,300)
                        : 'No description available'}
                </div>

                <a
                    class="apply-btn"
                    href="${job.job_apply_link}"
                    target="_blank"
                >
                    Apply Now
                </a>

            </div>

            `;

        });

    }catch(error){

        console.error(error);

        results.innerHTML = `
            <div class="loading">
                Error loading jobs.
            </div>
        `;

    }

    btn.innerHTML = 'Search Jobs';

}

</script>

</body>
</html>
